version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cybermesh-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cybermesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/03-procedures.sql
      - ./database/sample_data.sql:/docker-entrypoint-initdb.d/04-sample_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cybermesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cybermesh-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/cybermesh
      JWT_SECRET: cybermesh_super_secret_jwt_key_academic_demo_2026
      AI_SERVICE_URL: http://ai-service:8000
      FRONTEND_URL: http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: cybermesh-ai
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cybermesh-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
